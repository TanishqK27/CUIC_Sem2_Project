# CUIC Quant Fund - Logging Configuration
#
# Usage in Python:
#   import logging.config
#   import yaml
#
#   with open("configs/logging.yaml") as f:
#       config = yaml.safe_load(f)
#   logging.config.dictConfig(config)
#
#   logger = logging.getLogger("cuic_quant")
#   logger.info("Message")

version: 1
disable_existing_loggers: false

# -----------------------------------------------------------------------------
# Formatters
# -----------------------------------------------------------------------------
formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  simple:
    format: "%(levelname)s - %(message)s"

# -----------------------------------------------------------------------------
# Handlers
# -----------------------------------------------------------------------------
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  console_debug:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/cuic_quant.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf8

# -----------------------------------------------------------------------------
# Loggers
# -----------------------------------------------------------------------------
loggers:
  # Main application logger
  cuic_quant:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  # Data client loggers
  cuic_quant.data:
    level: INFO
    handlers: [console, file]
    propagate: false

  cuic_quant.data.polymarket_client:
    level: INFO
    handlers: [console, file]
    propagate: false

  cuic_quant.data.kalshi_client:
    level: INFO
    handlers: [console, file]
    propagate: false

  cuic_quant.data.odds_api:
    level: INFO
    handlers: [console, file]
    propagate: false

  # Strategy loggers
  cuic_quant.strategies:
    level: INFO
    handlers: [console, file]
    propagate: false

  # Suppress noisy third-party loggers
  urllib3:
    level: WARNING
    handlers: [console]
    propagate: false

  requests:
    level: WARNING
    handlers: [console]
    propagate: false

  httpx:
    level: WARNING
    handlers: [console]
    propagate: false

# -----------------------------------------------------------------------------
# Root logger
# -----------------------------------------------------------------------------
root:
  level: INFO
  handlers: [console]
