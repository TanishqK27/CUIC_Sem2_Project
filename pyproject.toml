[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuic-quant"
version = "0.1.0"
description = "CUIC Quant Fund - Sports Betting & Prediction Markets Research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Cardiff University Investment Club Quant Team"},
]
keywords = ["quantitative-finance", "sports-betting", "prediction-markets", "polymarket", "kalshi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # API clients
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",

    # Data validation
    "pydantic>=2.0.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",

    # Utilities
    "tqdm>=4.65.0",
    "tenacity>=8.2.0",  # Retry logic

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Background jobs
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",

    # Code quality
    "ruff>=0.1.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",

    # Type stubs
    "pandas-stubs>=2.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]

research = [
    # Jupyter
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",

    # Visualization
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "seaborn>=0.12.0",

    # Machine Learning
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",

    # Additional analysis
    "pyarrow>=12.0.0",  # Fast parquet I/O
]

server = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

all = [
    "cuic-quant[dev,research,server]",
]

[project.urls]
Repository = "https://github.com/CUIC/CUIC_Sem2_Project"

[project.scripts]
sync-logs = "scripts.sync_logs:main"
cuic-quant = "cuic_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "C901",   # Too complex
    "ARG001", # Unused function argument (common in method overrides)
]

[tool.ruff.lint.isort]
known-first-party = ["cuic_quant"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "S101"]
"research/**/*.py" = ["ERA001"]  # Allow commented code in notebooks

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Mypy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "research.*"
ignore_errors = true

# Pre-existing mypy errors from james_branch merge — to be fixed separately
[[tool.mypy.overrides]]
module = [
    "cuic_quant.strategies.mean_reversion",
    "cuic_quant.backtest.engine",
    "cuic_quant.backtest.data_loader",
    "cuic_quant.backtest.statistics",
    "cuic_quant.backtest.comparison",
    "cuic_quant.backtest.walk_forward._helpers",
    "cuic_quant.data.odds_api",
    "cuic_quant.data.kalshi_client",
]
ignore_errors = true

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external APIs",
]
asyncio_mode = "auto"

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["src/cuic_quant"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
